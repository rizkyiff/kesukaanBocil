<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tebak Makanan Hewan - Permainan Edukasi Anak</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top-bar">
    <div class="score-pill" aria-live="polite">
      <span class="score-label">Bintang:</span>
      <span id="score-value" class="score-value">0</span>
    </div>
    <div class="top-actions">
      <button type="button" id="sound-toggle" class="icon-btn" aria-pressed="true" aria-label="Matikan suara">
        <svg class="btn-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <path class="sound-wave" d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          <path class="sound-wave" d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
        </svg>
        <span id="sound-label">Suara Aktif</span>
      </button>
      <button type="button" id="shuffle-btn" class="action-btn">
        Acak Pilihan
      </button>
    </div>
  </header>

  <main class="game-stage">
    <section class="prompt-area" aria-labelledby="question-heading">
      <h1 id="question-heading" class="question-title">Kelinci suka makan apa ya?</h1>

      <figure class="animal-card">
        <div class="animal-image-wrap">
          <img
            id="animal-img"
            src="imgReference/bunny.jpg"
            alt="Gambar seekor kelinci cokelat dan putih yang lucu"
            width="480"
            height="270"
            fetchpriority="high"
          >
        </div>
        <figcaption id="animal-name" class="animal-nameplate">Kelinci</figcaption>
      </figure>
    </section>

    <section class="options-area" aria-label="Pilihan buah dan sayur">
      <div id="options-grid" class="options-grid" role="group" aria-label="Pilih satu makanan kesukaan kelinci">
        <!-- Opsi di-render dinamis oleh app.js -->
      </div>

      <div id="feedback-banner" class="feedback-banner" role="status" aria-live="polite">
        <p id="feedback-text" class="feedback-text">Ketuk gambar makanan yang disukai Kelinci!</p>
        <button type="button" id="next-round-btn" class="next-btn" hidden>
          Main Lagi
        </button>
      </div>
    </section>
  </main>

  <script src="app.js" defer></script>
</body>
</html>
